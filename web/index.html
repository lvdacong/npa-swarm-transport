<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Swarm</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main id="viewport">
  <canvas id="scene" tabindex="0" aria-label="粒子搬运场景；滚轮缩放，拖动平移，点击查看粒子"></canvas>
  <div class="toolbar" role="toolbar" aria-label="播放控制">
    <button id="play" class="primary" aria-label="播放" disabled><span id="play-icon">▶</span><span id="play-text">播放</span></button>
    <button id="reset" aria-label="重置场景" title="重置场景" disabled>↺</button>
    <span class="divider"></span>
    <button id="speed" aria-label="切换播放速度" title="1× / 4× / 8× / 不限速" disabled>4×</button>
    <span id="clock" class="clock">0.0 s</span>
    <button id="fit" aria-label="视图归位" title="视图归位">⌖</button>
    <button id="details" aria-label="显示诊断" title="诊断" aria-expanded="false">⋯</button>
  </div>
  <div class="status-strip" aria-live="polite">
    <span id="model-tag" class="warning" hidden>未训练</span>
    <span id="population">—</span><span class="divider"></span>
    <span id="found-object" class="endpoint"><i class="cargo-dot"></i>重物</span>
    <span id="found-goal" class="endpoint"><i class="goal-dot"></i>目的地</span>
    <span id="distance">剩余 —</span><span class="divider"></span>
    <span id="connected">连通 —</span><span id="bridge">待发现两端</span>
  </div>
  <div id="terminal" class="terminal" hidden></div>
  <div id="scene-error" role="alert" hidden></div>
  <aside id="diagnostics" hidden>
    <dl><dt>渲染设备</dt><dd id="adapter">—</dd><dt>模拟设备</dt><dd id="sim-device">—</dd>
      <dt>实际倍速</dt><dd id="actual-speed">—</dd><dt>新状态 / 秒</dt><dd id="state-rate">—</dd>
      <dt>绘制提交 / 秒</dt><dd id="draw-rate">—</dd><dt>模拟步耗时</dt><dd id="step-ms">—</dd>
      <dt>GPU 绘制</dt><dd id="gpu-ms">—</dd><dt>端点缺口</dt><dd id="endpoint-gap">—</dd>
      <dt>策略</dt><dd id="policy-mode">—</dd></dl>
    <div class="visual-code" aria-label="粒子状态独立视觉通道">
      <span><i class="visual-sample cargo"></i>内核 · 重物信息</span>
      <span><i class="visual-sample goal"></i>外环 · 目的地</span>
      <span><i class="visual-sample contact"></i>光晕 · 接触施力</span>
      <span><i class="visual-sample detached"></i>透明 · 离群</span>
    </div>
    <div class="visual-note">亮点 = 直接感知 · 金色为正向、断续珊瑚色为反向施力</div>
  </aside>
  <div id="selection" class="selection" hidden></div>
</main><script type="module" src="/app.js"></script>
</body></html>
