name: Engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Record actual environment
        run: python -m npa_swarm doctor --device cpu --output reports/ci/system.json
      - name: Physics, messages, recurrent PPO, resume and HTTP tests
        run: python -m pytest -q --junitxml=reports/ci/pytest.xml
      - name: Bounded 4096-agent inference and PPO
        run: python -m npa_swarm probe --device cpu --agents 4096 --steps 4 --warmup 1 --train-updates 1 --output reports/ci/probe4096
      - name: Upload raw results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-${{ matrix.os }}
          path: reports/ci/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and Chromium
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium
      - name: Actual 4096-particle Canvas browser
        run: python scripts/browser_smoke.py --particles 4096 --renderer canvas --output reports/ci/browser
      - name: Actual 4096-particle software WebGPU browser
        if: success() || failure()
        run: python scripts/browser_smoke.py --particles 4096 --renderer webgpu --output reports/ci/browser
      - name: Upload screenshots, failures and renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: reports/ci/browser/
          if-no-files-found: error
