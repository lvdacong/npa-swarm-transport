name: Optional Windows check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --junitxml=reports/windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-windows-check
          path: reports/windows.xml
